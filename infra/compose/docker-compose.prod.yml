# Production overlay for infra/compose/docker-compose.yml.
#
# Invoked explicitly (never auto-merged): `make prod-up` / `python scripts/agent/runner.py prod-up`,
# which runs `docker compose -f docker-compose.yml -f docker-compose.prod.yml ...`.
#
# No bind-mounts, no dev credential fallbacks — every ANYTOOLAI_POSTGRES_* variable is
# required (`${VAR:?...}`) and must come from the real deployment environment (secret
# store / CI secrets / exported env), never committed.
#
# Migrations run once via the `migrate` service (docker-compose.yml), not from platform-api's
# own entrypoint -- platform-api/platform-worker depend on it completing successfully before
# they start. That keeps migrations safe with multiple platform-api replicas. The stakeholder
# /demo start gate is intentionally process-local, however, so deployments exposing /demo must
# keep platform-api at one replica. See infra/deployment/README.md for the full story.
# Credentials are passed to platform-api/platform-worker as discrete env vars (below), not
# pre-assembled into a DATABASE_URL here -- see the matching note in docker-compose.yml. The app
# builds the DSN itself via SQLAlchemy's URL.create (anytoolai_platform_core.storage.db), which
# percent-encodes each component, so passwords containing @, :, /, %, # etc. survive intact.
x-postgres-credentials: &postgres-credentials
  ANYTOOLAI_POSTGRES_USER: ${ANYTOOLAI_POSTGRES_USER:?ANYTOOLAI_POSTGRES_USER must be set in production}
  ANYTOOLAI_POSTGRES_PASSWORD: ${ANYTOOLAI_POSTGRES_PASSWORD:?ANYTOOLAI_POSTGRES_PASSWORD must be set in production}
  ANYTOOLAI_POSTGRES_DB: ${ANYTOOLAI_POSTGRES_DB:?ANYTOOLAI_POSTGRES_DB must be set in production}

services:
  postgres:
    # Not published to the host by default (unlike dev) — platform-api/platform-worker
    # reach it over the compose network as `postgres:5432`. Add an explicit `ports:` entry
    # here (or in a local, uncommitted overlay) if an operator genuinely needs external
    # access, e.g. for manual psql/admin use.
    ports: !reset []
    environment:
      POSTGRES_USER: ${ANYTOOLAI_POSTGRES_USER:?ANYTOOLAI_POSTGRES_USER must be set in production}
      POSTGRES_PASSWORD: ${ANYTOOLAI_POSTGRES_PASSWORD:?ANYTOOLAI_POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${ANYTOOLAI_POSTGRES_DB:?ANYTOOLAI_POSTGRES_DB must be set in production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
  platform-api:
    environment:
      <<: *postgres-credentials
      ANYTOOLAI_ENABLED_PRODUCT_IDS: ${ANYTOOLAI_ENABLED_PRODUCT_IDS:?enabled products are required}
      ANYTOOLAI_DEMO_ACCESS_CODE: ""
      ANYTOOLAI_ATOM_LAB_ACCESS_CODE: ""
      ANYTOOLAI_LIVE_CANARY_TOKEN: ""
    # Own port variable (not ANYTOOLAI_API_PORT, which dev uses for per-worktree derived
    # ports) — a leftover dev override in the operator's shell must not silently redirect
    # which host port prod binds to. `!override` replaces the base file's ports list rather
    # than appending to it.
    ports: !override
      - "127.0.0.1:${ANYTOOLAI_PROD_API_PORT:-8000}:8000"
    restart: unless-stopped
    deploy:
      # A safety ceiling while the stakeholder /demo surface is enabled: its busy/daily gate
      # uses one process-local lock plus durable PostgreSQL counts. Replace that lock with a
      # PostgreSQL advisory lock before raising this value or using --scale platform-api=N.
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  platform-worker:
    environment:
      <<: *postgres-credentials
      ANYTOOLAI_ENABLED_PRODUCT_IDS: ${ANYTOOLAI_ENABLED_PRODUCT_IDS:?enabled products are required}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${ANYTOOLAI_PROD_WORKER_MEMORY_LIMIT:?worker memory limit is required}
  migrate:
    environment:
      <<: *postgres-credentials
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  web-mirror:
    build:
      context: ../..
      dockerfile: infra/docker/web-mirror.Dockerfile
      args:
        PLATFORM_API_BASE_URL: http://platform-api:8000
        NEXT_PUBLIC_ANYTOOLAI_ENABLED_PRODUCT_IDS: ${ANYTOOLAI_ENABLED_PRODUCT_IDS:?enabled products are required}
    depends_on:
      platform-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ANYTOOLAI_PROD_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
