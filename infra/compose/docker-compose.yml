# Credentials are passed to platform-api/platform-worker as discrete env vars (below), not
# pre-assembled into a DATABASE_URL here. Interpolating raw credentials into a connection-string
# template breaks silently if a password contains a reserved URL character (@, :, /, %, #) --
# the app builds the DSN itself via SQLAlchemy's URL.create, which percent-encodes each
# component correctly (see anytoolai_platform_core.storage.db.build_postgres_url_from_env).
x-postgres-credentials: &postgres-credentials
  ANYTOOLAI_POSTGRES_USER: ${ANYTOOLAI_POSTGRES_USER:-anytoolai}
  ANYTOOLAI_POSTGRES_PASSWORD: ${ANYTOOLAI_POSTGRES_PASSWORD:-anytoolai}
  ANYTOOLAI_POSTGRES_DB: ${ANYTOOLAI_POSTGRES_DB:-anytoolai}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ANYTOOLAI_POSTGRES_USER:-anytoolai}
      POSTGRES_PASSWORD: ${ANYTOOLAI_POSTGRES_PASSWORD:-anytoolai}
      POSTGRES_DB: ${ANYTOOLAI_POSTGRES_DB:-anytoolai}
    ports:
      - "${ANYTOOLAI_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANYTOOLAI_POSTGRES_USER:-anytoolai} -d ${ANYTOOLAI_POSTGRES_DB:-anytoolai}"]
      interval: 2s
      timeout: 3s
      retries: 30
  # One-shot: applies Alembic migrations to head, then exits. platform-api/platform-worker
  # depend on it completing successfully rather than running migrations themselves, so any
  # number of platform-api replicas can start concurrently without racing on schema changes
  # (see docker-compose.prod.yml's deploy.replicas comment).
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/platform-api.Dockerfile
      target: prod
    environment:
      <<: *postgres-credentials
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["uv", "run", "--project", "apps/platform-api", "--no-sync", "anytoolai-platform-migrate"]
  platform-api:
    build:
      context: ../..
      dockerfile: infra/docker/platform-api.Dockerfile
      target: prod
    environment:
      <<: *postgres-credentials
      # platform-api itself checks internal_only scenarios' X-Live-Canary-Token header against
      # this (ScenarioRuntimeService.start_session()) -- unset by default so normal dev-up/
      # quick-check stays credential-free; only live-canary (ANY-221) needs a real token.
      ANYTOOLAI_LIVE_CANARY_TOKEN: ${ANYTOOLAI_LIVE_CANARY_TOKEN:-}
      # Stakeholder /demo access code. Blank keeps POST /v1/demo/runs fail-closed while the
      # public page itself remains available; configure only through an operator secret store.
      ANYTOOLAI_DEMO_ACCESS_CODE: ${ANYTOOLAI_DEMO_ACCESS_CODE:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${ANYTOOLAI_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  platform-worker:
    build:
      context: ../..
      dockerfile: infra/docker/platform-worker.Dockerfile
    environment:
      <<: *postgres-credentials
      # Only the worker calls ProviderGateway; unset by default so normal dev-up/quick-check stays
      # credential-free -- only live-canary (ANY-221) needs a real key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # SIGTERM triggers graceful drain (finish the in-flight job, take no more) -- see
    # docs/exec-plans/active/any-147-worker-lease-recovery.md. Compose's 10s default grace
    # window is too short for anything but trivial jobs; a job still running when this expires
    # gets SIGKILLed and is instead recovered by the advisory-lock reconciliation sweep
    # (correct either way, just less graceful). Raise this if expected job durations grow.
    stop_grace_period: 60s
