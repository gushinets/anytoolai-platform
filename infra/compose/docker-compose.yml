# Kept in sync by hand with the x-database-url anchor in docker-compose.prod.yml — YAML
# anchors don't merge across separate `-f` files, so each compose file needs its own copy of
# this DSN shape. If you change the connection string format here (driver, host, port), make
# the same change there too.
x-database-url: &database-url postgresql+psycopg://${ANYTOOLAI_POSTGRES_USER:-anytoolai}:${ANYTOOLAI_POSTGRES_PASSWORD:-anytoolai}@postgres:5432/${ANYTOOLAI_POSTGRES_DB:-anytoolai}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ANYTOOLAI_POSTGRES_USER:-anytoolai}
      POSTGRES_PASSWORD: ${ANYTOOLAI_POSTGRES_PASSWORD:-anytoolai}
      POSTGRES_DB: ${ANYTOOLAI_POSTGRES_DB:-anytoolai}
    ports:
      - "${ANYTOOLAI_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANYTOOLAI_POSTGRES_USER:-anytoolai} -d ${ANYTOOLAI_POSTGRES_DB:-anytoolai}"]
      interval: 2s
      timeout: 3s
      retries: 30
  platform-api:
    build:
      context: ../..
      dockerfile: infra/docker/platform-api.Dockerfile
      target: prod
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ANYTOOLAI_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      # The entrypoint runs Alembic migrations to completion before uvicorn starts
      # listening, so the port is unreachable the whole time migrations run. Without
      # this, only retries * interval (60s) of grace exists before the healthcheck
      # marks the container unhealthy and breaks platform-worker's depends_on gate.
      start_period: 60s
  platform-worker:
    build:
      context: ../..
      dockerfile: infra/docker/platform-worker.Dockerfile
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
      platform-api:
        condition: service_healthy