[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anytoolai-platform-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "anytoolai-platform-core",
    "uvicorn>=0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.scripts]
anytoolai-platform-migrate = "anytoolai_platform_api.migrate:main"

[dependency-groups]
dev = [
    "watchfiles>=0.21",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
anytoolai-platform-core = { path = "../../packages/backend/platform-core", editable = true }
