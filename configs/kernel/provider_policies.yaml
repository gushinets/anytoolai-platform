provider_policies:
  - provider_policy_ref: default_fake_provider_v1
    provider: fake
    model: fake-json-v1
    temperature: 0.0
    timeout_seconds: 30
    retry_policy:
      transport:
        owner: fake_adapter
        max_attempts: 1
        litellm_num_retries_per_attempt: 0
      validation:
        owner: pydanticai
        max_attempts: 1
      hard_limits:
        max_physical_provider_calls_per_action: 1
    structured_output_mode: json_schema
    metadata:
      fixture_strategy: deterministic_metadata_key
  - provider_policy_ref: default_text_generation_v1
    provider: litellm
    model: anytoolai.default_text
    # gpt-6-luna with reasoning on accepts only the default temperature (1) and the API docs say to
    # drop the parameter; any other value is a 400. The LiteLLM adapter omits the temperature from
    # every request whose effective reasoning effort is not none: an explicit effort (Atom Lab) or
    # the router deployment's own (the default alias runs at medium). The 1.0 here is only the
    # fallback for a request that reaches a non-reasoning deployment.
    temperature: 1.0
    timeout_seconds: 60
    retry_policy:
      transport:
        owner: litellm
        max_attempts: 2
        litellm_num_retries_per_attempt: 0
      validation:
        owner: pydanticai
        max_attempts: 2
      hard_limits:
        max_physical_provider_calls_per_action: 4
    structured_output_mode: json_schema
    metadata:
      model_group: anytoolai.default_text
      routing_profile: default_text
