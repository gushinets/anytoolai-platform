handoffs:
  - handoff_id: kernel_demo_source_to_target_v1
    source_product_id: kernel_demo
    source_scenario_id: kernel_demo.handoff_smoke_source_v1
    target_product_id: kernel_demo
    target_frontend_id: kernel_demo_ce
    target_scenario_id: kernel_demo.handoff_smoke_target_v1
    target_start_policy: immediate
    consent_required: true
    context_mapping:
      source_text: artifact.content_json.values.deadline
      fields: 'literal:[{"name":"deadline","type":"string","description":"Project deadline mentioned in the text.","required":true},{"name":"budget","type":"string","description":"Budget mentioned in the text.","required":false},{"name":"deliverables","type":"array_of_strings","description":"Deliverables mentioned in the text.","required":false}]'
      strict: 'literal:false'
    preview_mapping:
      values: artifact.content_json.values
      missing_fields: artifact.content_json.missing_fields
