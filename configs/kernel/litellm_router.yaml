model_list:
  - model_name: anytoolai.default_text
    litellm_params:
      model: openai/gpt-6-luna
      api_key: env/OPENAI_API_KEY
      reasoning_effort: medium
      # Kept although LiteLLM 1.105.1 lists gpt-6-luna: a model its static registry does not list
      # yet would have this parameter rejected as unsupported although the API accepts it.
      allowed_openai_params: [reasoning_effort]

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
