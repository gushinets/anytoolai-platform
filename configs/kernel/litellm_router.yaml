model_list:
  - model_name: anytoolai.default_text
    litellm_params:
      model: openai/gpt-6-luna
      api_key: env/OPENAI_API_KEY
      reasoning_effort: medium
      # LiteLLM's static model registry does not list gpt-6-luna yet, so it would reject this
      # parameter as unsupported although the API accepts it.
      allowed_openai_params: [reasoning_effort]

# The effort a direct (Atom Lab) call reasons at when it names none; the adapter drops the
# temperature for these models. The router alias above carries its own effort.
direct_model_default_reasoning:
  openai/gpt-6-luna: medium
  openai/gpt-6-sol: medium

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
