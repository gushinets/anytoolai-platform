name: docs
on: [pull_request]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"
      - run: uv sync --locked --group dev --config-file infra/python/uv-build.toml
      - run: uv run --no-sync python scripts/agent/runner.py validate-docs
      - run: uv run --no-sync python scripts/agent/runner.py generate-docs --check
