name: docs
on: [pull_request]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"
      - run: uv sync --locked --group dev --config-file infra/python/uv-build.toml
      - run: uv run --no-sync python scripts/agent/runner.py validate-docs
      - run: uv run --no-sync python scripts/agent/runner.py generate-docs --check
