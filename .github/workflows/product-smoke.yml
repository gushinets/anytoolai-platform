name: product-smoke
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    env:
      SMOKE_COMMAND: ${{ inputs.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@anytoolai/$SMOKE_COMMAND" exec playwright install --with-deps chromium
      - name: Boot dev Compose stack (waits for platform-api healthy)
        run: python scripts/agent/runner.py dev-up
        env:
          ANYTOOLAI_READY_TIMEOUT: "120"
      - name: Run product browser smoke
        run: python scripts/agent/runner.py "$SMOKE_COMMAND"
      - name: Dump Docker Compose logs on failure
        if: failure()
        run: |
          PROJECT=$(python -c "import sys; sys.path.insert(0, 'scripts/agent'); from runner import runtime_identity; print(runtime_identity().compose_project)")
          docker compose --project-name "$PROJECT" \
            -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.override.yml \
            logs --no-color
      - name: Tear down dev stack
        if: always()
        run: python scripts/agent/runner.py dev-down
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.command }}-evidence
          path: .agent/${{ inputs.command }}/
          if-no-files-found: ignore
      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.command }}-traces
          path: tests/e2e/${{ inputs.command }}/test-results/
          if-no-files-found: ignore
