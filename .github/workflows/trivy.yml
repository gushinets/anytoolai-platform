name: Trivy security

on:
  workflow_call:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filesystem:
    name: Trivy dependencies and Dockerfile report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Scan dependencies and Dockerfiles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: sarif
          output: trivy-results.sarif
          # Preserve all findings; the next step gates dependency vulnerabilities.
          exit-code: '0'
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
      - name: Reject High and Critical dependency vulnerabilities
        run: >-
          trivy fs --cache-dir "$GITHUB_WORKSPACE/.cache/trivy"
          --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 .
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-filesystem-sarif
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Publish to GitHub Security
        # PRs, including forks and Dependabot, keep artifact-only reports.
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
