name: proposal-ai-smoke
on:
  # Path-filtered, not repo-wide -- same precedent as client-handoff-smoke.yml. Not added to branch
  # protection as a required check yet (per AGENTS.md, smoke checks become required only once
  # they've proven stable), so it can run on every touching PR without blocking merges.
  pull_request:
    paths:
      - "apps/web-mirror/**"
      - "apps/platform-api/**"
      - "apps/platform-worker/**"
      - "packages/frontend/ce-kit/**"
      - "packages/frontend/web-result-kit/**"
      - "packages/backend/platform-core/**"
      - "packages/backend/platform-actions/**"
      - "packages/backend/product-platforms/freelancer-suite/**"
      - "infra/compose/**"
      - "infra/docker/**"
      - "tests/e2e/proposal-ai-smoke/**"
      - "scripts/agent/runner.py"
      - ".github/workflows/proposal-ai-smoke.yml"
      - "tests/e2e/smoke-support/**"
      - ".github/workflows/product-smoke.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:
  schedule:
    # Weekly baseline run against main, independent of any particular PR's paths.
    - cron: "0 8 * * 1"
permissions:
  contents: read
jobs:
  proposal-ai-smoke:
    uses: ./.github/workflows/product-smoke.yml
    with:
      command: proposal-ai-smoke
