name: live-canary
on:
  workflow_dispatch:
  schedule:
    # Weekly, credentialed -- this is the repo's only workflow that ever runs against a real
    # provider (see ANY-221). Normal CI (backend.yml) stays entirely credential-free.
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  live-canary:
    runs-on: ubuntu-latest
    # Bounded well under GitHub's 360-minute default: image build + dev-up healthcheck + 14 real
    # provider-backed cases (each capped at DEFAULT_TIMEOUT_SECONDS, degrading further on a
    # timeout) + teardown normally finish in well under this. Without a cap, a hung container or a
    # stuck provider call could otherwise sit unnoticed for hours on this unattended weekly
    # schedule before anyone sees it failed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen --group dev
      # OPENAI_API_KEY/ANYTOOLAI_LIVE_CANARY_TOKEN are scoped to exactly these two steps, not
      # job-level: docker-compose.yml's worker service interpolates OPENAI_API_KEY (and
      # platform-api interpolates ANYTOOLAI_LIVE_CANARY_TOKEN, for internal_only scenarios'
      # X-Live-Canary-Token header) at container-creation time, during this step's `docker
      # compose up` -- both must be present here, or every scheduled run would silently make 0
      # real provider calls / reject every case as not-found. runner.py's live-canary command
      # also reads both directly from its own process env for its LIVE000/LIVE011 fail-fast
      # checks, so both must be present on the later step too. Every other step (checkout,
      # setup-python, setup-uv, uv sync, log dump, teardown, upload) has no need for either
      # secret, so job-level env would only widen exposure with no benefit.
      - name: Boot dev Compose stack (waits for platform-api healthy)
        run: uv run python scripts/agent/runner.py dev-up
        env:
          ANYTOOLAI_READY_TIMEOUT: "120"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANYTOOLAI_LIVE_CANARY_TOKEN: ${{ secrets.ANYTOOLAI_LIVE_CANARY_TOKEN }}
      - name: Run 11-atom live provider canary
        run: uv run python scripts/agent/runner.py live-canary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANYTOOLAI_LIVE_CANARY_TOKEN: ${{ secrets.ANYTOOLAI_LIVE_CANARY_TOKEN }}
      # Same debuggability precedent as backend.yml's compose-smoke-dev job: dump every
      # container's logs before teardown so a failure is diagnosable from the Actions log alone.
      - name: Dump Docker Compose logs on failure
        if: failure()
        run: |
          PROJECT=$(uv run python -c "import sys; sys.path.insert(0, 'scripts/agent'); from runner import runtime_identity; print(runtime_identity().compose_project)")
          docker compose --project-name "$PROJECT" \
            -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.override.yml \
            logs --no-color
      - name: Tear down dev stack
        if: always()
        run: uv run python scripts/agent/runner.py dev-down
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-canary-evidence
          path: .agent/live-canary/
          if-no-files-found: ignore
