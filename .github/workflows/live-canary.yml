name: live-canary
on:
  workflow_dispatch:
  schedule:
    # Weekly, credentialed -- this is the repo's only workflow that ever runs against a real
    # provider (see ANY-221). Normal CI (backend.yml) stays entirely credential-free.
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  live-canary:
    runs-on: ubuntu-latest
    # Bounded well under GitHub's 360-minute default: image build + dev-up healthcheck + 14 real
    # provider-backed cases (each capped at DEFAULT_TIMEOUT_SECONDS, degrading further on a
    # timeout) + teardown normally finish in well under this. Without a cap, a hung container or a
    # stuck provider call could otherwise sit unnoticed for hours on this unattended weekly
    # schedule before anyone sees it failed.
    timeout-minutes: 30
    steps:
      # A local action reference (./.github/actions/...) can only be resolved after the repo is
      # checked out, so checkout must stay a job-level step here, not inside the composite action.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      # OPENAI_API_KEY/ANYTOOLAI_LIVE_CANARY_TOKEN are scoped to exactly the dev-up and
      # check-command steps inside the composite action, not job-level: docker-compose.yml's
      # worker service interpolates OPENAI_API_KEY (and platform-api interpolates
      # ANYTOOLAI_LIVE_CANARY_TOKEN, for internal_only scenarios' X-Live-Canary-Token header) at
      # container-creation time, during dev-up's `docker compose up` -- both must be present
      # there, or every scheduled run would silently make 0 real provider calls / reject every
      # case as not-found. runner.py's live-canary command also reads both directly from its own
      # process env for its LIVE000/LIVE011 fail-fast checks, so both must be present on the
      # check-command step too. See .github/actions/compose-stack-check/action.yml.
      - uses: ./.github/actions/compose-stack-check
        with:
          bootstrap-quick-check: "true"
          check-command: live-canary
          check-step-name: Run 11-atom live provider canary
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          live-canary-token: ${{ secrets.ANYTOOLAI_LIVE_CANARY_TOKEN }}
          upload-evidence: "true"
          evidence-artifact-name: live-canary-evidence
          evidence-artifact-path: .agent/live-canary/
