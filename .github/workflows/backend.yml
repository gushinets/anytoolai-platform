name: baseline-backend
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/agent/runner.py doctor
      - run: uv run python scripts/agent/runner.py quick-check
  full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.1
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/agent/runner.py full-check
  compose-smoke-dev:
    # Proves the dev Compose configuration actually boots end-to-end -- not just that it's
    # syntactically valid -- by booting it, waiting for platform-api to report healthy, and
    # driving a real kernel_demo job through the real platform-worker container (see
    # scripts/agent/kernel_demo_smoke.py; platform-worker has no Docker healthcheck of its own,
    # so this is the only way to prove it's actually consuming jobs). Split into its own job
    # (rather than sequential steps alongside the prod leg) so it runs in parallel with
    # compose-smoke-prod instead of roughly doubling this check's wall-clock time on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen --group dev
      - name: Boot dev Compose stack (waits for platform-api healthy)
        run: uv run python scripts/agent/runner.py dev-up
      - name: kernel_demo smoke check against dev
        run: uv run python scripts/agent/runner.py dev-smoke
      - name: Tear down dev stack
        if: always()
        run: uv run python scripts/agent/runner.py dev-down
  compose-smoke-prod:
    # Same proof as compose-smoke-dev, but for the prod overlay (disposable test credentials,
    # never real secrets). Its own job so it runs in parallel with compose-smoke-dev.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen --group dev
      - name: Boot prod Compose overlay (test secrets, waits for platform-api healthy)
        run: uv run python scripts/agent/runner.py prod-up
        env:
          ANYTOOLAI_POSTGRES_USER: ci_produser
          ANYTOOLAI_POSTGRES_PASSWORD: ci_testpass123
          ANYTOOLAI_POSTGRES_DB: ci_proddb
      - name: kernel_demo smoke check against prod
        run: uv run python scripts/agent/runner.py prod-smoke
      - name: Tear down prod stack
        if: always()
        run: uv run python scripts/agent/runner.py prod-down
        env:
          ANYTOOLAI_POSTGRES_USER: ci_produser
          ANYTOOLAI_POSTGRES_PASSWORD: ci_testpass123
          ANYTOOLAI_POSTGRES_DB: ci_proddb
  test-dev-stack:
    # End-to-end smoke test of the dev Docker Compose stack (infra/compose/docker-compose.yml):
    # boots it via runner.py, waits for platform-api's /health check, drives a real kernel_demo
    # scenario through platform-worker over HTTP, then always tears the stack down. Catches
    # breakage that quick-check/full-check can't see because those never run `docker compose up`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen --group dev

      # Boots docker-compose.yml (+ override) in the background. dev_up() already blocks on
      # dev_ready() internally; ANYTOOLAI_READY_TIMEOUT bounds both this and the explicit
      # health-gate step below.
      - name: Start dev Compose stack (docker compose up -d)
        run: uv run python scripts/agent/runner.py dev-up
        env:
          ANYTOOLAI_READY_TIMEOUT: "120"

      # Explicit health gate: polls GET {api_url}/health until 200 OK, failing the job
      # (non-zero exit) if platform-api never becomes healthy within the timeout.
      - name: Wait for platform-api /health
        run: uv run python scripts/agent/runner.py dev-ready
        env:
          ANYTOOLAI_READY_TIMEOUT: "120"

      # Real end-to-end smoke test (scripts/agent/kernel_demo_smoke.py): creates a guest
      # identity, starts the kernel_demo.single_action_smoke_v1 scenario over HTTP, and polls
      # the scenario session until it reports "completed" (with a result artifact), "failed",
      # or times out. This is the only way to prove platform-worker -- which has no HTTP
      # surface or Docker healthcheck of its own -- is actually consuming jobs, not just that
      # its container is running.
      - name: kernel_demo end-to-end smoke test
        run: uv run python scripts/agent/runner.py dev-smoke

      # Debuggability: if setup, the health gate, or the smoke test failed, dump every
      # container's logs to the CI console before the stack is torn down, so the failure is
      # diagnosable from the Actions log alone (no need to reproduce locally). Resolves the
      # compose project name via a pure Python computation (no docker call) rather than
      # `dev-status` (which itself shells out to `docker compose ps`) -- otherwise, under
      # `set -eo pipefail`, a broken Docker daemon (a realistic cause of the very failure
      # this step exists to diagnose) would make `dev-status` fail, abort the pipeline, and
      # skip `docker compose logs` entirely.
      - name: Dump Docker Compose logs on failure
        if: failure()
        run: |
          PROJECT=$(uv run python -c "import sys; sys.path.insert(0, 'scripts/agent'); from runner import runtime_identity; print(runtime_identity().compose_project)")
          docker compose --project-name "$PROJECT" \
            -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.override.yml \
            logs --no-color

      # Crucial: always tear down, even if any step above failed, so a failed run doesn't
      # leak containers/networks/volumes on the runner.
      - name: Tear down dev stack
        if: always()
        run: uv run python scripts/agent/runner.py dev-down
  postgresql-quota-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: anytoolai
          POSTGRES_PASSWORD: anytoolai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anytoolai -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - run: uv sync --frozen --group dev
      - run: >-
          uv pip install --no-deps
          -e packages/backend/platform-sdk
          -e packages/backend/platform-core
          -e packages/backend/platform-actions
          -e apps/platform-api
      - run: uv run python -m pytest apps/platform-api/tests/test_quota_concurrency_postgresql.py -m "slow and postgresql" -q
        env:
          ANYTOOLAI_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://anytoolai:anytoolai@127.0.0.1:5432/postgres
