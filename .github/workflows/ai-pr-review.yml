name: AI PR Review

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  statuses: read
  pull-requests: write
  checks: write

jobs:
  comment-gate:
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/ai-review')
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      check_run_id: ${{ steps.gate.outputs.check_run_id }}
    steps:
      - id: gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            core.setOutput('run', 'false');

            if (context.payload.comment.body.trim() !== '/ai-review') {
              return;
            }

            const { owner, repo } = context.repo;
            const prNumber = context.payload.issue.number;
            const actor = context.actor;

            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: actor,
            });
            if (!['write', 'maintain', 'admin'].includes(permission.data.permission)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `🤖 @${actor}, you need write access to run \`/ai-review\`.`,
              });
              return;
            }

            const pull = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            if (pull.data.state !== 'open') {
              return;
            }

            const headSha = pull.data.head.sha;
            const detailsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const check = await github.rest.checks.create({
              owner,
              repo,
              name: 'AI PR Review Trigger',
              head_sha: headSha,
              status: 'in_progress',
              details_url: detailsUrl,
              output: {
                title: 'AI PR Review requested',
                summary: `Manual review requested by @${actor} for ${headSha}.`,
              },
            });

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', headSha);
            core.setOutput('check_run_id', String(check.data.id));

            let checkCompleted = false;
            try {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                check_name: 'AI PR Review Trigger',
                filter: 'all',
                per_page: 100,
              });
              const activeCandidates = checks.data.check_runs
                .filter((candidate) => candidate.status === 'queued' || candidate.status === 'in_progress')
                .sort((left, right) => left.id - right.id);
              const winner = activeCandidates[0];

              if (!winner || winner.id !== check.data.id) {
                await github.rest.checks.update({
                  owner,
                  repo,
                  check_run_id: check.data.id,
                  status: 'completed',
                  conclusion: 'neutral',
                  output: {
                    title: 'AI PR Review already running',
                    summary: `Another request is already reviewing ${headSha}.`,
                  },
                });
                checkCompleted = true;
                try {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body: `🤖 AI Review is already running for \`${headSha.slice(0, 7)}\`.`,
                  });
                } catch (error) {
                  core.warning(`Could not post duplicate-review notice: ${error instanceof Error ? error.message : String(error)}`);
                }
                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `🤖 AI Review started for \`${headSha.slice(0, 7)}\` (requested by @${actor}).`,
              });

              core.setOutput('run', 'true');
            } catch (error) {
              if (!checkCompleted) {
                try {
                  await github.rest.checks.update({
                    owner,
                    repo,
                    check_run_id: check.data.id,
                    status: 'completed',
                    conclusion: 'failure',
                    output: {
                      title: 'AI PR Review trigger failed',
                      summary: 'The manual review request failed before the review pipeline started.',
                    },
                  });
                } catch (cleanupError) {
                  core.warning(`Could not finalize failed trigger check: ${cleanupError instanceof Error ? cleanupError.message : String(cleanupError)}`);
                }
              }
              throw error;
            }

  ai-pr-review:
    needs: [comment-gate]
    if: needs.comment-gate.outputs.run == 'true'
    uses: gushinets/ai-pr-review/.github/workflows/reusable-ai-pr-review.yml@95418b2d1575c9624da2a15db42657b5fef96aeb
    with:
      mode: manual
      triggering_run_id: ""
      pr_number: ${{ fromJSON(needs.comment-gate.outputs.pr_number) }}
      expected_head_sha: ${{ needs.comment-gate.outputs.head_sha }}
    secrets:
      QWEN_TOKEN_PLAN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_API_KEY }}
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}

  finalize-trigger:
    needs: [comment-gate, ai-pr-review]
    if: >-
      always() &&
      needs.comment-gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          CHECK_RUN_ID: ${{ needs.comment-gate.outputs.check_run_id }}
          REVIEW_RESULT: ${{ needs.ai-pr-review.result }}
        with:
          script: |
            const conclusion = process.env.REVIEW_RESULT === 'success' ? 'success' : 'failure';
            await github.rest.checks.update({
              ...context.repo,
              check_run_id: Number(process.env.CHECK_RUN_ID),
              status: 'completed',
              conclusion,
              output: {
                title: 'AI PR Review trigger completed',
                summary: `Review workflow result: ${process.env.REVIEW_RESULT}.`,
              },
            });
