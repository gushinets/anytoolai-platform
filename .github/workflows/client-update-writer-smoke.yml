name: client-update-writer-smoke
on:
  # Path-filtered, not repo-wide -- same precedent as proposal-ai-smoke.yml/client-handoff-smoke.yml.
  # Not added to branch protection as a required check yet (per AGENTS.md, smoke checks become
  # required only once they've proven stable), so it can run on every touching PR without blocking
  # merges.
  pull_request:
    paths:
      - "apps/web-mirror/**"
      - "apps/platform-api/**"
      - "apps/platform-worker/**"
      - "packages/frontend/ce-kit/**"
      - "packages/frontend/shared-ui/**"
      - "packages/frontend/web-result-kit/**"
      - "packages/backend/platform-core/**"
      - "packages/backend/platform-actions/**"
      - "packages/backend/platform-sdk/**"
      - "packages/backend/product-platforms/freelancer-suite/**"
      - "configs/kernel/**"
      - "tests/fixtures/provider/fake_provider_outputs/client_update_writer.*"
      - "infra/compose/**"
      - "infra/docker/**"
      - "tests/e2e/client-update-writer-smoke/**"
      - "scripts/agent/runner.py"
      - ".github/workflows/client-update-writer-smoke.yml"
  workflow_dispatch:
  schedule:
    # Weekly baseline run against main, independent of any particular PR's paths.
    - cron: "0 9 * * 1"
permissions:
  contents: read
jobs:
  client-update-writer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anytoolai/client-update-writer-smoke exec playwright install --with-deps chromium
      - name: Boot dev Compose stack (waits for platform-api healthy)
        run: python scripts/agent/runner.py dev-up
        env:
          ANYTOOLAI_READY_TIMEOUT: "120"
      - name: Run Client Update Writer browser-evidence smoke
        run: python scripts/agent/runner.py client-update-writer-smoke
      - name: Dump Docker Compose logs on failure
        if: failure()
        run: |
          PROJECT=$(python -c "import sys; sys.path.insert(0, 'scripts/agent'); from runner import runtime_identity; print(runtime_identity().compose_project)")
          docker compose --project-name "$PROJECT" \
            -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.override.yml \
            logs --no-color
      - name: Tear down dev stack
        if: always()
        run: python scripts/agent/runner.py dev-down
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-update-writer-smoke-evidence
          path: .agent/client-update-writer-smoke/
          if-no-files-found: ignore
