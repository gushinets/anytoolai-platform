version: 2
updates:
  - package-ecosystem: uv
    open-pull-requests-limit: 0
    directories:
      - /
      - /apps/platform-api
      - /apps/platform-worker
      - /packages/backend/platform-core
      - /packages/backend/platform-actions
      - /packages/backend/platform-sdk
      - /packages/backend/product-platforms/freelancer-suite
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Keep each dependency's manifests and independent locks together in one PR.
    groups:
      python-dependencies:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directories:
      - /
      - /scripts/agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      javascript-dependencies:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directories:
      - /
      - /.github/actions/compose-stack-check
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directory: /infra/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    open-pull-requests-limit: 0
    directory: /infra/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
