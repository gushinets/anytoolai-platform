renderer_contract:
  scenario_id: proposal_ai.generate_v1
  output_schema_ref: proposal_ai.generate_output_v1
  # apps/web-mirror/src/products/proposalAi renders the parts in this order; this file pins the
  # contract that renderer is built against, not the renderer.
  parts:
    - part_id: proposal
      field: text
      description: >-
        The copy-ready proposal body, verbatim, no wrapping or reformatting. It is the only copy
        target and the only text a successful copy is recorded for (`copy_result`).
    - part_id: experience_gaps
      field: gaps
      description: >-
        Requirements of the task that the freelancer's stated experience does not cover, each with
        `category` (always `experience_gap`), `description`, `severity` and optional `evidence`.
        Informational, shown next to the proposal and never copied. An empty list is valid and the
        block is hidden.
  canonical_field: text
  next_action: copy_result
  excluded_fields: [angle, rationale, model, provider]
  description: >-
    ProposalAI never exposes angle, rationale, model, provider or other hidden product fields in the
    rendered result. `gaps` is the A04 `experience_gap` issue list and is not part of the proposal
    text.
