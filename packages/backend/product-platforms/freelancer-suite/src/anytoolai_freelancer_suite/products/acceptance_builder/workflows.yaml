workflows:
- workflow_id: acceptance_builder.draft_v1
  version: 1
  input_schema_ref: acceptance_builder.draft_input_v1
  output_schema_ref: acceptance_builder.draft_output_v1
  steps:
  - step_id: extract
    action_config_id: acceptance_builder.extract_v1
    input_mapping:
      source_text: scenario.input.brief_text
      fields: literal:[{"name":"acceptance_criteria","type":"array_of_strings","description":"Conditions the brief says the
        finished work must satisfy. When two statements directly contradict each other, put neither version in
        acceptance_criteria. Keep non-conflicting checkable conditions and exact dates, amounts and counts.","required":false},{"name":"assumptions","type":"array_of_strings","description":"Things
        the brief explicitly takes for granted. Wishes about style or business outcomes are not assumptions.","required":false},{"name":"deliverables","type":"array_of_strings","description":"Concrete
        deliverables the client expects.","required":false},{"name":"analysis_language","type":"string","description":"Case-insensitive
        analysis language identifier using 2-3 ASCII letters, optionally followed by hyphen-separated 2-8-character alphanumeric
        subtags (ru, es-MX, zh-Hant-TW). Select it from the original brief by the prompt language rule. Always report it,
        even for a vague brief; it is presentation metadata, not a project requirement.","required":true}]
      strict: literal:true
    output_mapping:
      context.workflow_output.extracted: steps.extract.output
  - step_id: detect_issues
    action_config_id: acceptance_builder.detect_issues_v1
    input_mapping:
      source_text: scenario.input.brief_text
      taxonomy: &issue_taxonomy 'literal:["missing_information","ambiguity","scope_risk","timeline_risk","budget_risk","contradiction"]'
    output_mapping:
      context.workflow_output.issues: steps.detect_issues.output.issues
      # A05 requires at least one issue; seed the empty default it overrides below.
      context.workflow_output.questions: 'literal:[]'
  - step_id: generate_questions
    action_config_id: acceptance_builder.generate_questions_v1
    # An empty issues list is falsy: a clean brief skips A05 instead of failing its input.
    when: steps.detect_issues.output.issues
    input_mapping:
      issues: steps.detect_issues.output.issues
      taxonomy: *issue_taxonomy
      context: scenario.input.brief_text
      target_audience: 'literal:"the client who wrote the brief"'
      max_questions: 'literal:5'
    output_mapping:
      context.workflow_output.questions: steps.generate_questions.output.questions
- workflow_id: acceptance_builder.check_v1
  version: 1
  input_schema_ref: acceptance_builder.check_input_v1
  output_schema_ref: acceptance_builder.check_output_v1
  steps:
  - step_id: extract
    action_config_id: acceptance_builder.extract_v1
    input_mapping:
      source_text: scenario.input.brief_text
      fields: literal:[{"name":"acceptance_criteria","type":"array_of_strings","description":"Conditions the brief says the
        finished work must satisfy.","required":false},{"name":"assumptions","type":"array_of_strings","description":"Things
        the brief takes for granted or states as assumed.","required":false},{"name":"deliverables","type":"array_of_strings","description":"Concrete
        deliverables the client expects.","required":false},{"name":"analysis_language","type":"string","description":"Case-insensitive
        analysis language identifier using 2-3 ASCII letters, optionally followed by hyphen-separated 2-8-character alphanumeric
        subtags (ru, es-MX, zh-Hant-TW). Select it from the original brief by the prompt language rule. Always report it,
        even for a vague brief; it is presentation metadata, not a project requirement.","required":true}]
      strict: literal:true
    output_mapping:
      context.workflow_output.extracted: steps.extract.output
  - step_id: compare
    action_config_id: acceptance_builder.compare_v1
    input_mapping:
      subject_text: scenario.input.deliverable_text
      reference_text: scenario.input.brief_text
      categories: literal:["meets_expectations","partially_meets","does_not_meet"]
      criteria: literal:[{"id":"scope_coverage","description":"The deliverable covers everything in scope that the brief asks
        for.","weight":3},{"id":"requirement_fit","description":"What was delivered does what the brief says it must do.","weight":3},{"id":"completeness","description":"Every
        deliverable the brief lists is present.","weight":2},{"id":"clarity","description":"The deliverable text states plainly
        what was done and what was not.","weight":1}]
    output_mapping:
      context.workflow_output.comparison: steps.compare.output
