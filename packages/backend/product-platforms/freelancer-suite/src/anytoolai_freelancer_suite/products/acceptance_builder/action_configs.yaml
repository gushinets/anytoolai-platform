action_configs:
  # Shared by both scenarios: same prompt, same field list.
  - action_config_id: acceptance_builder.extract_v1
    action_type: text.extract_structured_fields
    prompt_ref: acceptance_builder.extract.v1
    provider_policy_ref: default_fake_provider_v1

  - action_config_id: acceptance_builder.compare_v1
    action_type: text.compare_and_classify
    prompt_ref: acceptance_builder.compare.v1
    provider_policy_ref: default_fake_provider_v1

  - action_config_id: acceptance_builder.draft_document_v1
    action_type: document.generate_from_template
    prompt_ref: acceptance_builder.draft_document.v1
    provider_policy_ref: default_fake_provider_v1

  - action_config_id: acceptance_builder.check_document_v1
    action_type: document.generate_from_template
    prompt_ref: acceptance_builder.check_document.v1
    provider_policy_ref: default_fake_provider_v1
