renderer_contract:
  scenarios:
    - scenario_id: acceptance_builder.draft_v1
      output_schema_ref: acceptance_builder.draft_output_v1
      parts:
        - acceptance_criteria
        - assumptions
        - deliverables
        - risks
        - client_questions
        - open_gaps
        - analysis_language
    - scenario_id: acceptance_builder.check_v1
      output_schema_ref: acceptance_builder.check_output_v1
      parts:
        - comparison_verdict
        - acceptance_criteria
        - assumptions
        - deliverables
        - open_gaps
        - analysis_language
  parts:
    - part_id: comparison_verdict
      field: comparison
      description: '`verdict` (meets_expectations | partially_meets | does_not_meet | insufficient_brief), `confidence`, and
        one `delta` per general review criterion (scope_coverage, requirement_fit, completeness, clarity)
        with `status` and `evidence`. The verdict is judged on those four general criteria only, NOT item
        by item on the extracted acceptance criteria; the renderer must not label it a check of the extracted
        list. A match confirms the criterion, partial means incomplete confirmation, and mismatch means a
        contradiction or explicit failure. For partial or mismatch verdicts, show the verdict and distinct
        nonempty rationale lines in first-seen order before the scope note and collapsed recap. For all-match
        verdicts, show the verdict and keep the ordinary rationale in the recap. The recap shows all four
        labeled statuses and full evidence in schema order, then any detailed rationale, the extracted lists
        and gaps. For insufficient_brief, regardless of the four delta statuses,
        the client asks for requirements at the brief field and shows no verdict, copy text or result view.'
    - part_id: acceptance_criteria
      field: extracted.values.acceptance_criteria
      description: Conditions the brief imposes on the finished work. When absent (listed in `extracted.missing_fields`)
        it renders as "not specified in the brief" -- never as a claim that the brief is complete.
    - part_id: assumptions
      field: extracted.values.assumptions
      description: Same absent-list rule as `acceptance_criteria`.
    - part_id: deliverables
      field: extracted.values.deliverables
      description: Same absent-list rule as `acceptance_criteria`.
    - part_id: risks
      field: issues
      description: Risks, contradictions and ambiguities with supporting evidence when present.
    - part_id: client_questions
      field: questions
      description: Up to five clarifying questions in priority order.
    - part_id: open_gaps
      field: extracted.missing_fields
      description: The lists absent from the brief, plus every missing-information finding for Draft.
    - part_id: analysis_language
      field: extracted.values.analysis_language
      description: Case-insensitive analysis language selected from original brief, including explicit
        overrides; independent of UI locale. Supported BCP 47-style shape is a 2–3-letter language
        code with optional hyphen-separated 2–8-character alphanumeric subtags, not full registry
        validation or extension/private-use singleton forms. Preserve the tag; lowercase its primary
        subtag for presentation lookup.
  copy_text:
    authority: structured_fields_only
    not_copyable_fields:
      - document
    blocks:
      - block_id: verdict
        scenarios:
          - acceptance_builder.check_v1
        source: comparison.verdict
        body: >-
          Localized verdict label and status on one line (`Verdict: <status>.` in English), without a
          standalone title. Then distinct nonempty rationale lines as findings for partial or mismatch.
          Then all four localized per-delta labels/statuses with full evidence in schema order, followed by
          the ordinary rationale for all-match only. Never composed for insufficient_brief. The verdict
          concerns the four general criteria, not item by item acceptance criteria. Show the full copy text
          on clipboard failure so it can be selected manually.
        also_uses:
          - comparison.deltas
          - comparison.rationale
      - block_id: acceptance_criteria
        title: Acceptance criteria
        source: extracted.values.acceptance_criteria
        body: One "- <item>" line per item, in array order.
        when_absent: analysis_language.missing
      - block_id: assumptions
        title: Assumptions
        source: extracted.values.assumptions
        body: One "- <item>" line per item, in array order.
        when_absent: analysis_language.missing
      - block_id: deliverables
        title: Deliverables
        source: extracted.values.deliverables
        body: One "- <item>" line per item, in array order.
        when_absent: analysis_language.missing
      - block_id: risks
        scenarios:
          - acceptance_builder.draft_v1
        title: Risks and contradictions
        source: issues
        body: Localized category and description for each issue except missing_information, with indented evidence when present.
        when_empty: analysis_language.no_risks
      - block_id: client_questions
        scenarios:
          - acceptance_builder.draft_v1
        title: Questions for the client
        source: questions
        body: Numbered questions in array order.
        when_empty: analysis_language.no_questions
      - block_id: open_gaps
        title: Open gaps
        source: extracted.missing_fields
        body: Localized name and confirmation request for each missing list. Draft also includes each
          missing_information issue description and evidence from issues, in issue order, regardless
          of whether a question references it.
        when_empty: analysis_language.lists_present
        when_empty_check: analysis_language.complete
    language_source: extracted.values.analysis_language
    supported_wording_languages:
      - en
      - ru
      - es
      - de
      - fr
      - it
      - pt
    unknown_language: Preserve model prose and use neutral markers/identifiers; no English prose fallback.
  next_action: copy_result
  excluded_fields: []
  recap:
    authority: structured_fields_only
    composition: Same presenter as copy_text; deterministic verdict/status and missing-list wording. No
      independent model document. Independent model document content is ignored.
