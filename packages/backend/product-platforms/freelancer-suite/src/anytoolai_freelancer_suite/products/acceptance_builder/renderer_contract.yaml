renderer_contract:
  scenarios:
    - scenario_id: acceptance_builder.draft_v1
      output_schema_ref: acceptance_builder.draft_output_v1
      parts:
        - acceptance_criteria
        - assumptions
        - deliverables
        - open_gaps
        - analysis_language
    - scenario_id: acceptance_builder.check_v1
      output_schema_ref: acceptance_builder.check_output_v1
      parts:
        - comparison_verdict
        - acceptance_criteria
        - assumptions
        - deliverables
        - open_gaps
        - analysis_language
  parts:
    - part_id: comparison_verdict
      field: comparison
      description: '`verdict` (meets_expectations | partially_meets | does_not_meet), `confidence`, and
        one `delta` per general review criterion (scope_coverage, requirement_fit, completeness, clarity)
        with `status` and `evidence`. The verdict is judged on those four general criteria only, NOT item
        by item on the extracted acceptance criteria; the renderer must not label it a check of the extracted
        list.'
    - part_id: acceptance_criteria
      field: extracted.values.acceptance_criteria
      description: Conditions the brief imposes on the finished work. When absent (listed in `extracted.missing_fields`)
        it renders as "not specified in the brief" -- never as a claim that the brief is complete.
    - part_id: assumptions
      field: extracted.values.assumptions
      description: Same absent-list rule as `acceptance_criteria`.
    - part_id: deliverables
      field: extracted.values.deliverables
      description: Same absent-list rule as `acceptance_criteria`.
    - part_id: open_gaps
      field: extracted.missing_fields
      description: The lists the brief does not state, by name. Empty means the brief states all three
        lists.
    - part_id: analysis_language
      field: extracted.values.analysis_language
      description: BCP 47 analysis language selected from original brief, including explicit overrides;
        independent of UI locale.
  copy_text:
    authority: structured_fields_only
    not_copyable_fields:
      - document
    blocks:
      - block_id: verdict
        scenarios:
          - acceptance_builder.check_v1
        title: Verdict
        source: comparison.verdict
        body: Localized verdict and per-delta label/status selected by enum, followed by unchanged evidence
          and rationale. The verdict concerns the four general criteria, not item by item acceptance criteria.
        also_uses:
          - comparison.deltas
          - comparison.rationale
      - block_id: acceptance_criteria
        title: Acceptance criteria
        source: extracted.values.acceptance_criteria
        body: One "- <item>" line per item, in array order.
        when_absent: analysis_language.missing
      - block_id: assumptions
        title: Assumptions
        source: extracted.values.assumptions
        body: One "- <item>" line per item, in array order.
        when_absent: analysis_language.missing
      - block_id: deliverables
        title: Deliverables
        source: extracted.values.deliverables
        body: One "- <item>" line per item, in array order.
        when_absent: analysis_language.missing
      - block_id: open_gaps
        title: Open gaps
        source: extracted.missing_fields
        body: Localized name and confirmation request for each missing list; determined only by missing_fields.
        when_empty: analysis_language.complete
    language_source: extracted.values.analysis_language
    supported_wording_languages:
      - en
      - ru
      - es
      - de
      - fr
      - it
      - pt
    unknown_language: Preserve model prose and use neutral markers/identifiers; no English prose fallback.
  next_action: copy_result
  excluded_fields: []
  recap:
    authority: structured_fields_only
    composition: Same presenter as copy_text; deterministic verdict/status and missing-list wording. No
      independent model document. Independent model document content is ignored.
