workflows:
  - workflow_id: client_update_writer.update_v1
    version: 1
    input_schema_ref: client_update_writer.update_input_v1
    output_schema_ref: kernel.schemas.compose_reply_output_v1
    steps:
      - step_id: compose_reply
        action_config_id: client_update_writer.update_compose_reply_v1
        input_mapping:
          situation: scenario.input.progress_notes
          intent: 'literal:"Give the client a clear, concrete update on project progress and next steps."'
          tone: scenario.input.tone
          constraints: '?scenario.input.constraints'

  - workflow_id: client_update_writer.reply_draft_v1
    version: 1
    input_schema_ref: client_update_writer.reply_draft_input_v1
    output_schema_ref: kernel.schemas.compose_reply_output_v1
    steps:
      - step_id: compose_reply
        action_config_id: client_update_writer.reply_draft_compose_reply_v1
        input_mapping:
          situation: scenario.input.client_message
          intent: scenario.input.reply_goal
          tone: scenario.input.tone
          constraints: '?scenario.input.constraints'

  - workflow_id: client_update_writer.prepaid_request_v1
    version: 2
    input_schema_ref: client_update_writer.prepaid_request_input_v1
    output_schema_ref: kernel.schemas.compose_reply_output_v1
    steps:
      - step_id: compose_reply
        action_config_id: client_update_writer.prepaid_request_compose_reply_v1
        input_mapping:
          situation: "template:Amount: {scenario.input.billing_context.amount}\nDue date: {?scenario.input.billing_context.due_date}\nBilling notes: {scenario.input.billing_context.notes}"
          intent: 'literal:"Write the message the billing notes call for: a request to promptly send the prepayment and let you know once it has been sent when the payment terms are agreed, otherwise a request to confirm the terms that does not ask for payment."'
          tone: scenario.input.tone
          constraints: '?scenario.input.constraints'
        output_mapping:
          context.workflow_output: steps.compose_reply.output
