renderer_contract:
  scenario_id: brief_decoder.decode_v1
  output_schema_ref: brief_decoder.decode_output_v1
  # The result is one composed object with four parts. apps/web-mirror/src/products/briefDecoder
  # renders them in this order; copied text follows copy_text below.
  parts:
    - part_id: brief
      field: brief
      description: >-
        Structured brief: `values` (facts the brief states) next to `missing_fields` (facts it
        does not state). Optional `confidence` is per-field and is not shown as a copy target.
    - part_id: issues
      field: issues
      description: >-
        Risks and gaps, each with `category`, `severity`, `description` and optional `evidence`.
        An empty list is valid and renders as "no issues found".
        If any issue has category `missing_task_description`, the product page shows a
        localized error on the brief field and hides the result, Copy and Acceptance Builder
        handoff. On recovery, `brief_text` from the matching artifact supplies the rejected
        input and restores the untouched form. The artifact still has all four parts and
        ordinary run accounting.
    - part_id: clarifying_questions
      field: questions
      description: >-
        Questions to send the client, in the given (priority) order, each tied to its issue by
        `source_issue_index`. A05 generates questions using the ordinary issue categories.
        Version 2 results created with the previous A05 taxonomy can carry a
        `missing_task_description` question label. Only an issue with that category triggers
        field feedback. An empty list is valid and renders as "no clarifying questions were
        generated" -- this is not a readiness claim: an empty `questions` list does not mean the
        brief is complete or fit to start (see the artifact's own `issues` and
        `brief.missing_fields`, not this part alone). Only `summary_document` makes a readiness
        call, and it must weigh all three signals, not the empty question list alone. An empty
        list is also not an activation (activation = first rendering of a non-empty question
        list).
    - part_id: summary_document
      field: document
      description: >-
        Ordered `sections` (id, title, content) followed by `summary`, written by the model.
        Display only: never copied (see `copy_text`).
  canonical_field_composition: >-
    Built from the structured fields only, never from `document` (ANY-616). Blocks in this
    order, separated by one blank line: (1) the brief heading, then one "<field label>: <value>"
    line per stated `brief.values` string field and, for an array field, a "<field label>:"
    line followed by one "- <item>" line per item, in schema field order; (2) only when
    `brief.missing_fields` is non-empty, a "not stated in the brief" heading followed by one
    "- <field label>" line per missing field (labels in words, never schema keys); (3) the
    issues heading, then one "- <category label> · <severity label>: <description>" line per
    issue, with an indented localized evidence line when `evidence` is non-empty, or the
    "no issues found" line; (4) the clarifying-questions heading with the count, then one
    "<n>. <question>" line per question in array order, or the "no clarifying questions"
    line. Values, descriptions, evidence and question texts are copied verbatim. Labels are
    UI-locale words (decode_output_v1 carries no analysis language).
  copy_text:
    authority: structured_fields_only
    sources:
      - brief.values
      - brief.missing_fields
      - issues
      - questions
    not_copyable_fields:
      - document
      - brief.confidence
  next_action: copy_result
  excluded_fields:
    - brief_text
