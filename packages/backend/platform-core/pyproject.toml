[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anytoolai-platform-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "litellm==1.105.1",
    "pydantic==2.13.4",
    "pyyaml",
    "sqlalchemy>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# litellm pins filelock<4.0 and 3.x has no fix for GHSA-v4x8-3wr5-3wq8 (CVE-2026-112940).
# Remove once litellm allows filelock 4.x.
override-dependencies = ["filelock>=4.2.1,<5"]
