[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anytoolai-platform-actions"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anytoolai-platform-core",
    "markdown-it-py>=3.0.0",
    "pydantic-ai-slim>=2.53.0",
    "google-re2>=1.1",
    "sqlalchemy>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
anytoolai-platform-core = { path = "../platform-core", editable = true }

[tool.uv]
# litellm pins filelock<4.0 and 3.x has no fix for GHSA-v4x8-3wr5-3wq8 (CVE-2026-112940).
# Remove once litellm allows filelock 4.x.
override-dependencies = ["filelock>=4.2.1"]
